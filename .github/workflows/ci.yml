name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every commit pushed to main gets its own run. A new push to a pull request
# cancels that pull request's older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The Flutter release recorded in .metadata.
          flutter-version: 3.35.1
          channel: stable
          cache: true

      - name: Get packages
        id: pub-get
        run: flutter pub get

      - name: Check that pubspec.lock is up to date
        run: |
          # git status, unlike git diff, also reports a lockfile that the
          # commit lacks and flutter pub get had to create.
          state=$(git status --porcelain -- pubspec.lock)
          if [ -z "$state" ]; then exit 0; fi
          if [ "${state:0:2}" = "??" ]; then
            message="pubspec.lock is missing from the commit, so flutter pub get had to create it. Run flutter pub get and commit pubspec.lock."
          else
            changes=$(git diff -- pubspec.lock)
            changes=${changes//'%'/'%25'}
            changes=${changes//$'\r'/'%0D'}
            changes=${changes//$'\n'/'%0A'}
            message="Run flutter pub get and commit pubspec.lock. It changed pubspec.lock like this:%0A%0A${changes}"
          fi
          echo "::error file=pubspec.lock,title=pubspec.lock is out of date::${message}"
          exit 1

      - name: Analyze
        # Run even when pubspec.lock is out of date.
        if: ${{ !cancelled() && steps.pub-get.outcome == 'success' }}
        run: |
          # Show each analyzer finding as an annotation on the commit.
          echo "::add-matcher::.github/problem-matchers/flutter-analyze.json"
          flutter analyze

      - name: Test
        id: test
        # Run the tests even when the analyzer reports issues.
        if: ${{ !cancelled() && steps.pub-get.outcome == 'success' }}
        run: flutter test --file-reporter "json:$RUNNER_TEMP/flutter-test-report.json"

      - name: Annotate failing tests
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        run: python3 .github/scripts/annotate_test_failures.py "$RUNNER_TEMP/flutter-test-report.json"

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the Firestore emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}

      - run: npm ci

      - run: npm test

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Android Gradle plugin needs JDK 17 or later.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.35.1
          channel: stable
          cache: true

      - name: Build the release APK
        run: |
          # Without android/key.properties the release build is signed with
          # the debug key: installable for testing, not publishable.
          set +e
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # The job log needs a GitHub sign-in, so put the reason in an
            # annotation: Dart compile errors, then Gradle's explanation.
            reason=$({ grep -E ': Error: ' "$RUNNER_TEMP/build.log" | head -n 10; awk '/What went wrong/ { found = 1 } found' "$RUNNER_TEMP/build.log" | head -n 30; } || true)
            [ -n "$reason" ] || reason=$(tail -n 30 "$RUNNER_TEMP/build.log")
            reason=${reason//'%'/'%25'}
            reason=${reason//$'\r'/'%0D'}
            reason=${reason//$'\n'/'%0A'}
            echo "::error title=Android build failed::${reason}"
          fi
          exit "$status"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-release.apk
          archive: false
          retention-days: 14
          if-no-files-found: error
