name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every commit pushed to main gets its own run. A new push to a pull request
# cancels that pull request's older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The Flutter release recorded in .metadata.
          flutter-version: 3.35.1
          channel: stable
          cache: true

      - name: Get packages
        id: pub-get
        run: flutter pub get

      - name: Check that pubspec.lock is up to date
        run: |
          # git status, unlike git diff, also reports a lockfile that the
          # commit lacks and flutter pub get had to create.
          state=$(git status --porcelain -- pubspec.lock)
          if [ -z "$state" ]; then exit 0; fi
          if [ "${state:0:2}" = "??" ]; then
            message="pubspec.lock is missing from the commit, so flutter pub get had to create it. Run flutter pub get and commit pubspec.lock."
          else
            changes=$(git diff -- pubspec.lock)
            changes=${changes//'%'/'%25'}
            changes=${changes//$'\r'/'%0D'}
            changes=${changes//$'\n'/'%0A'}
            message="Run flutter pub get and commit pubspec.lock. It changed pubspec.lock like this:%0A%0A${changes}"
          fi
          echo "::error file=pubspec.lock,title=pubspec.lock is out of date::${message}"
          exit 1

      - name: Analyze
        # Run even when pubspec.lock is out of date.
        if: ${{ !cancelled() && steps.pub-get.outcome == 'success' }}
        run: |
          # Show each analyzer finding as an annotation on the commit.
          echo "::add-matcher::.github/problem-matchers/flutter-analyze.json"
          flutter analyze

      - name: Test
        id: test
        # Run the tests even when the analyzer reports issues.
        if: ${{ !cancelled() && steps.pub-get.outcome == 'success' }}
        run: flutter test --file-reporter "json:$RUNNER_TEMP/flutter-test-report.json"

      - name: Annotate failing tests
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        run: python3 .github/scripts/annotate_test_failures.py "$RUNNER_TEMP/flutter-test-report.json"

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the Firestore emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}

      - run: npm ci

      - run: npm test
