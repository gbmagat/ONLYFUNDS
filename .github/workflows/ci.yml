name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every commit pushed to main gets its own run. A new push to a pull request
# cancels that pull request's older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The Flutter release recorded in .metadata.
          flutter-version: 3.35.1
          channel: stable
          cache: true

      - name: Get packages
        id: pub-get
        run: flutter pub get

      - name: Analyze
        run: |
          # Show each analyzer finding as an annotation on the commit.
          echo "::add-matcher::.github/problem-matchers/flutter-analyze.json"
          flutter analyze

      - name: Test
        # Run the tests even when the analyzer reports issues.
        if: ${{ !cancelled() && steps.pub-get.outcome == 'success' }}
        run: flutter test

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the Firestore emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}

      - run: npm ci

      - run: npm test
